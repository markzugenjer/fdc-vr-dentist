<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FDC Dentist</title>
    <meta name="theme-color" content="#7cc9ad" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fdf7f9; }
      #app, #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud {
        position: fixed; top: 16px; left: 16px; max-width: min(360px, calc(100vw - 32px));
        padding: 14px 16px; border-radius: 16px; display: grid; gap: 10px;
        background: rgba(255, 255, 255, 0.92); color: #2e3b36;
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        box-shadow: 0 6px 24px rgba(63, 143, 116, 0.16); border: 2px solid #dcf3ea;
      }
      #hud[hidden] { display: none; }
      .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
      .brand b { color: #3f8f74; }
      .brand span { color: #e98aa4; }
      .status { color: #71817a; font-size: 13px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .row button {
        font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 18px;
        cursor: pointer; background: #5fb89a; color: #fff;
      }
      .row button:focus-visible { outline: 3px solid #f6b9c9; outline-offset: 2px; }
      .help { margin: 0; color: #71817a; font-size: 12.5px; }
      kbd { font: 12px ui-monospace, Menlo, monospace; background: #dcf3ea; border-radius: 4px; padding: 1px 5px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="brand"><b>fdc</b> Dentist <span>♥</span></div>
      <div class="status" id="status">Memuat…</div>
      <div class="row"><button id="enter-vr" type="button" hidden>Masuk VR</button></div>
      <p class="help">
        Desktop: klik alat di baki, lalu klik-tahan mulut pasien · geser untuk melihat ·
        <kbd>Space</kbd> kembalikan alat · <kbd>M</kbd> menu
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
